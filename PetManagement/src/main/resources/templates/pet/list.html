
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物列表 - 宠物管理平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(13, 110, 253, 0.05);
        }
        .action-btn {
            padding: 0.25rem 0.5rem;
            margin: 0 0.1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/pet-api/">
                <i class="bi bi-heart-pulse"></i> 宠物管理平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/pet-api/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/pet-api/pet/list">宠物管理</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <div class="row align-items-center">
                    <div class="col">
                        <h4 class="mb-0"><i class="bi bi-list-ul"></i> 宠物列表</h4>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary" onclick="addPet()">
                            <i class="bi bi-plus-circle"></i> 添加宠物
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchInput" placeholder="搜索宠物名称、类型、品种或主人姓名">
                            <button class="btn btn-outline-primary" type="button" onclick="search()">
                                <i class="bi bi-search"></i> 搜索
                            </button>
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>名称</th>
                                <th>类型</th>
                                <th>品种</th>
                                <th>年龄</th>
                                <th>性别</th>
                                <th>主人</th>
                                <th>健康状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="petTableBody">
                        </tbody>
                    </table>
                </div>

                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">确认删除</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    确定要删除这条宠物信息吗？
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">确定删除</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;
        let pageSize = 10;
        let deletePetId = null;
        const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

        // 加载宠物列表
        function loadPetList(page) {
            currentPage = page;
            const keyword = document.getElementById('searchInput').value.trim();

            fetch(`/pet-api/pet/page?current=${page}&size=${pageSize}&keyword=${encodeURIComponent(keyword)}`)
                .then(response => response.json())
                .then(result => {
                    if (result.code === 200) {
                        renderTable(result.data.records);
                        renderPagination(result.data);
                    } else {
                        alert('加载数据失败：' + result.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('加载数据失败');
                });
        }

        // 渲染表格
        function renderTable(pets) {
            const tbody = document.getElementById('petTableBody');
            tbody.innerHTML = '';

            if (pets.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">暂无数据</td></tr>';
                return;
            }

            pets.forEach(pet => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${pet.id}</td>
                    <td>${pet.name || '-'}</td>
                    <td>${pet.type || '-'}</td>
                    <td>${pet.breed || '-'}</td>
                    <td>${pet.age || '-'}</td>
                    <td>${pet.gender || '-'}</td>
                    <td>${pet.ownerName || '-'}</td>
                    <td><span class="badge ${pet.healthStatus === '健康' ? 'bg-success' : 'bg-warning'}">${pet.healthStatus || '-'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary action-btn" onclick="editPet(${pet.id})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger action-btn" onclick="showDeleteModal(${pet.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 渲染分页
        function renderPagination(page) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            const totalPages = Math.ceil(page.total / pageSize);

            // 上一页
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
            prevLi.innerHTML = `<a class="page-link" href="#" onclick="loadPetList(${currentPage - 1})">上一页</a>`;
            pagination.appendChild(prevLi);

            // 页码
            for (let i = 1; i <= totalPages; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === currentPage ? 'active' : ''}`;
                li.innerHTML = `<a class="page-link" href="#" onclick="loadPetList(${i})">${i}</a>`;
                pagination.appendChild(li);
            }

            // 下一页
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
            nextLi.innerHTML = `<a class="page-link" href="#" onclick="loadPetList(${currentPage + 1})">下一页</a>`;
            pagination.appendChild(nextLi);
        }

        // 搜索
        function search() {
            loadPetList(1);
        }

        // 添加宠物
        function addPet() {
            window.location.href = '/pet-api/pet/form';
        }

        // 编辑宠物
        function editPet(id) {
            window.location.href = `/pet-api/pet/form?id=${id}`;
        }

        // 显示删除确认框
        function showDeleteModal(id) {
            deletePetId = id;
            deleteModal.show();
        }

        // 确认删除
        function confirmDelete() {
            if (!deletePetId) return;

            fetch(`/pet-api/pet/delete/${deletePetId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(result => {
                if (result.code === 200) {
                    alert('删除成功');
                    deleteModal.hide();
                    loadPetList(currentPage);
                } else {
                    alert('删除失败：' + result.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('删除失败');
            });
        }

        // 页面加载时获取列表
        document.addEventListener('DOMContentLoaded', function() {
            loadPetList(1);
        });
    </script>
</body>
</html>
