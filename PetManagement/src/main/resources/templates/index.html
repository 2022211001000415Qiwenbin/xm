
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物管理平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .feature-card {
            transition: transform 0.3s;
            cursor: pointer;
        }
        .feature-card:hover {
            transform: translateY(-5px);
        }
        .feature-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/pet-api/">
                <i class="bi bi-heart-pulse"></i> 宠物管理平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/pet-api/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pet-api/pet/list">宠物管理</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center mb-5">
                <h1 class="display-4 mb-3">欢迎使用宠物管理平台</h1>
                <p class="lead">轻松管理您的宠物信息，记录每一个温馨时刻</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card feature-card h-100" onclick="window.location.href='/pet-api/pet/list'">
                    <div class="card-body text-center">
                        <i class="bi bi-list-ul text-primary feature-icon"></i>
                        <h3 class="card-title">宠物列表</h3>
                        <p class="card-text">查看所有宠物信息，支持搜索和筛选</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card feature-card h-100" onclick="window.location.href='/pet-api/pet/form'">
                    <div class="card-body text-center">
                        <i class="bi bi-plus-circle text-success feature-icon"></i>
                        <h3 class="card-title">添加宠物</h3>
                        <p class="card-text">添加新的宠物信息，记录详细资料</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card feature-card h-100" onclick="window.location.href='/pet-api/pet/list'">
                    <div class="card-body text-center">
                        <i class="bi bi-pencil-square text-warning feature-icon"></i>
                        <h3 class="card-title">编辑信息</h3>
                        <p class="card-text">更新宠物信息，保持数据最新</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light mt-5 py-4">
        <div class="container text-center">
            <p class="mb-0">© 2024 宠物管理平台 - 用心呵护每一个生命</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
